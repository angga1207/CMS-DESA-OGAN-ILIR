# Livewire 4 uses a versioned prefix such as /livewire-9bf29492.
#
# Keep this location ABOVE generic static-file locations (jpg, jpeg, png, js,
# css, and similar). The ^~ modifier prevents an uploaded preview filename such
# as preview-file/<hash>.jpeg from being handled as a physical static file.
location ^~ /livewire- {
    try_files $uri $uri/ /index.php?$query_string;

    # Temporary upload previews are private signed responses and must not be
    # cached by Nginx or a reverse proxy/CDN.
    add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
    expires off;
}
